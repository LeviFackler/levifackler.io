name: Deploy Hugo Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # Allows manual trigger from GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true   # if your theme is a submodule

      - name: Setup Node.js (for Tailwind v4 + PostCSS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies + fix LightningCSS for Linux
        run: |
          npm ci --include=optional
          npm install --no-save lightningcss-linux-x64-gnu

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'   # or latest
          extended: true

      - name: Build Hugo site
        run: hugo --minify --environment production

      - name: Deploy to VPS via rsync
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete
          path: public/
          remote_path: /var/www/levifackler.io/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
