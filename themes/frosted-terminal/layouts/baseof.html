<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}" class="scroll-smooth">
<head>
  {{ partial "head.html" . }}
</head>
<body class="min-h-screen relative">
  <!-- Fixed Background Layer: Optimizes performance for backdrop-filters -->
  <div class="fixed inset-0 -z-10 bg-terminal-black bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-zinc-900 via-terminal-black to-terminal-black pointer-events-none"></div>

  {{ if not .IsHome }}
  <div class="fixed top-8 left-8 z-50 pointer-events-none">
    <div class="w-2.5 h-5 bg-hacker-green cursor-blink"></div>
  </div>
  {{ end }}

  <main>
    {{ block "main" . }}{{ end }}
  </main>
  
  {{ partial "dock.html" . }}
</body>
</html>
